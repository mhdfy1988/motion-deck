name: MotionDeck Verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run browser and desktop regression manually (normally tested locally)'
        type: boolean
        default: false
      pose_diagnostics:
        description: 'Only profile the pose-library regression (not a release gate)'
        type: boolean
        default: false
      diagnostic_swangle:
        description: 'Compare explicit Chromium software graphics driver'
        type: boolean
        default: false
      model_diagnostics:
        description: 'Profile model readiness and the failing loading tests'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !inputs.pose_diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:verify
      # 真实Windows ACL子进程与求解器测试不争用冷启动资源，保留原10秒安全预算。
      - run: node --test --test-concurrency=1 tests/web/*.test.mjs
      - run: npx playwright install chrome
        if: ${{ inputs.full_regression }}
      - name: Prepare and validate pinned FFmpeg
        if: ${{ inputs.full_regression }}
        shell: pwsh
        run: ./scripts/prepare-ci-ffmpeg.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'motiondeck-ffmpeg')
      - run: npm run test:e2e
        if: ${{ inputs.full_regression }}
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          retention-days: 7
  desktop:
    if: ${{ inputs.full_regression && !inputs.pose_diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare and validate pinned FFmpeg
        shell: pwsh
        run: ./scripts/prepare-ci-ffmpeg.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'motiondeck-ffmpeg')
      - run: npm run desktop:pack
      - name: Build isolated update installers
        shell: pwsh
        run: |
          $env:MOTIONDECK_BUILD_VARIANT = 'acceptance'
          $env:MOTIONDECK_BUILD_VERSION = '0.0.1'
          $env:MOTIONDECK_BUILD_OUTPUT = 'update-acceptance/old'
          node scripts/package-installer.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:MOTIONDECK_BUILD_VERSION = '0.0.2'
          $env:MOTIONDECK_BUILD_OUTPUT = 'update-acceptance/new'
          node scripts/package-installer.mjs
      - shell: pwsh
        run: |
          $env:MOTIONDECK_PACKAGED_EXE = Join-Path $pwd 'output/desktop/MotionDeck-win32-x64/MotionDeck.exe'
          $env:MOTIONDECK_DEV_PREVIEW_EXE = Join-Path $pwd 'output/update-acceptance/new/MotionDeckAcceptance-win32-x64/MotionDeckAcceptance.exe'
          $env:MOTIONDECK_TEST_OLD_INSTALLER = Join-Path $pwd 'output/update-acceptance/old/installer/MotionDeckAcceptance-0.0.1-setup-x64.exe'
          $env:MOTIONDECK_TEST_NEW_INSTALLER = Join-Path $pwd 'output/update-acceptance/new/installer/MotionDeckAcceptance-0.0.2-setup-x64.exe'
          npm.cmd run desktop:test
  pose-diagnostics:
    if: ${{ inputs.pose_diagnostics }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chrome
      - name: Profile readiness without changing the whole-test budget
        shell: pwsh
        run: |
          if ($env:MODEL_DIAGNOSTICS -eq 'true') {
            npx.cmd playwright test --config playwright.config.js model-ready.spec.js standalone.spec.js timeline-edge-modes.spec.js
          } else {
            npx.cmd playwright test --config playwright.config.js pose-library.spec.js
          }
        env:
          DEBUG: pw:api
          MODEL_DIAGNOSTICS: ${{ inputs.model_diagnostics }}
          MOTIONDECK_DIAGNOSTIC_SWANGLE: ${{ inputs.diagnostic_swangle && '1' || '0' }}
      - name: Preserve diagnostic traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pose-diagnostic-traces
          path: test-results/
          retention-days: 7
