name: MotionDeck Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:verify
      - run: npm test
      - run: npx playwright install chrome
      - run: choco install ffmpeg --no-progress -y
      - run: npm run test:e2e
